<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NEU Toronto Assistant – v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
  :root{
    --cm: 37.8px; /* 1cm ≈ 37.8px */
    --neu-red:#C8102E; --text:#111; --muted:#666; --border:#DBDBDB; --white:#FFF;
    --bubble-w: 7.2;        /* cm */
    --bubble-r-offset: 0.3;  /* cm from right wall */
    --bubble-v-gap: 0.3;     /* cm vertical gap */
    --bubble-radius: 0.25;   /* cm */
    --btn-h: 0.8;            /* cm */

    --body-padding: 0.5;     /* cm */
    --panel-max-h: 12;       /* cm */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Lato',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    background:transparent;
    color:var(--text);
  }

  .window{
  width: 100%;
  max-width: 350px;
  margin: 8px auto;     /* center inside frame */
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,.12);
  position: relative;
  overflow: hidden;
  transition: width .2s ease, height .2s ease, max-height .2s ease;
}

  .window.max{
    max-width:none;
    width:100%;
    max-height:none;
  }

  .header{
    position: sticky; top: 0; z-index: 5;
    height: calc(3 * var(--cm)); background: #000;
    display:flex; align-items:center; padding: 0 calc(0.5 * var(--cm));
    border-bottom: 1px solid #000;
  }
  .header .logo{ height: calc(1 * var(--cm)); margin-left: calc(1.25 * var(--cm)); }
 .header .actions{
  margin-left: auto;
  display: none;             /* hide maximize / close UI */
  gap:12px;
  position: relative;
  right: calc(0.25 * var(--cm));
}
  .icon-btn{ width: calc(0.5 * var(--cm)); height: calc(0.5 * var(--cm)); cursor:pointer; user-select:none; display:block; }
  .icon-btn svg{ width:100%; height:100%; display:block; fill:#fff; }

  .skyline{
    position:absolute; left:0; right:0; bottom:0;
    height: calc(11 * var(--cm));
    background: url("{{ url_for('static', filename='skyline.jpg') }}") center/cover no-repeat;
    opacity:.05; pointer-events:none;
  }

  .body{
  position: relative;
  padding: calc(0.5 * var(--cm));
  padding-top: calc(0.75 * var(--cm));
  max-height: calc(12 * var(--cm));
  overflow-y: auto;
  overflow-x: hidden;
}
  .stack{ min-height: 0; padding-bottom: calc(0.5 * var(--cm)); }

  .body::-webkit-scrollbar{ width:5px; }
  .body::-webkit-scrollbar-thumb{
    background:rgba(0,0,0,.15);
    border-radius:999px;
  }
  .body{ scrollbar-width:thin; scrollbar-color:rgba(0,0,0,.15) transparent; }

  .bubble-row{
    display:flex;
    align-items:flex-start;
    justify-content:flex-end;
    gap: calc(0.2 * var(--cm));
    margin-bottom: calc(var(--bubble-v-gap) * var(--cm));
  }
  .bubble-avatar{
    width: calc(0.7 * var(--cm));
    height: calc(0.7 * var(--cm));
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    background:#fff;
    border:1px solid rgba(0,0,0,.08);
    display:flex; align-items:center; justify-content:center;
  }
  .bubble-avatar img{
    width:100%; height:100%; object-fit:cover;
  }

  .card{
  background: var(--white); border:1px solid var(--border);
  border-radius: calc(var(--bubble-radius) * var(--cm));
  width: 100%;
  max-width: 100%;
  padding: 14px 16px; box-shadow: 0 1px 0 rgba(0,0,0,.03);
  line-height: 1.45;
}

  .title{ color:var(--neu-red); font-weight:700; font-size:20px; margin:0 0 6px 0; }
  .p{ margin:0; font-size:13px; color:var(--text); }

  /* Typing indicator bubble */
  .typing{ display:flex; align-items:center; gap:6px; color:var(--muted); }
  .typing .dots{ display:inline-flex; gap:4px }
  .typing .dots span{
    width:4px; height:4px; border-radius:50%;
    background:var(--muted); opacity:.4;
    animation:blink 1s infinite ease-in-out;
  }
  .typing .dots span:nth-child(2){ animation-delay:.15s; }
  .typing .dots span:nth-child(3){ animation-delay:.3s; }

  @keyframes blink{
    0%,100%{ transform:translateY(0); opacity:.3; }
    50%{ transform:translateY(-1px); opacity:1; }
  }

  .row{
    display:flex;
    flex-wrap:wrap;
    gap: calc(0.25 * var(--cm));
    margin-top: calc(0.25 * var(--cm));
  }
  .btn{
    border-radius:999px;
    border:1px solid #CCC;
    padding:0 calc(0.5 * var(--cm));
    height: calc(var(--btn-h) * var(--cm));
    font-size:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#f9f9f9;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .btn:hover{
    background:#efefef;
    box-shadow:0 1px 3px rgba(0,0,0,.12);
    transform:translateY(-0.5px);
  }
  .btn.selected,
  .btn:active{
    background:var(--neu-red);
    color:#fff;
    border-color:var(--neu-red);
    box-shadow:0 0 0 1px rgba(200,16,46,.35);
  }

  a{ color:#004990; text-decoration:none; }
  a:hover{ text-decoration:underline; }

  ul{ margin:6px 0 0 1.1em; padding:0; }
  li{ margin:2px 0; font-size:13px; }

  .meta{ margin-top:6px; font-size:11px; color:#777; }
  .disclaimer{
    font-size:11px; margin-top:8px; color:#555;
    border-top:1px dashed #E0E0E0; padding-top:6px;
  }

  .you{
    background:#EAF3FF;
    border-color:#BFD7FF;
  }

  @media (max-width:420px){
    .window{ margin:4px auto; }
    .header{ padding:0 calc(0.25 * var(--cm)); }
    .header .logo{ margin-left: calc(0.5 * var(--cm)); height: calc(0.9 * var(--cm)); }
  }

  </style>
</head>
<body>
  <div class="window" id="win">
    <div class="header">
      <!-- PRESERVED LOGO -->
      <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="Northeastern University">

      <!-- Inline SVG controls (minimize/maximize/close) -->
      <div class="actions">
        <!-- Maximize -->
        <span id="btn-max" class="icon-btn" title="Maximize">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" fill="none" stroke="#fff" stroke-width="2"/>
          </svg>
        </span>
        <!-- Minimize (hidden until maximized) -->
        <span id="btn-min" class="icon-btn" title="Minimize" style="display:none;">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="11" width="14" height="2" fill="#fff"/>
          </svg>
        </span>
        <!-- Close -->
        <span id="btn-exit" class="icon-btn" title="Exit">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" stroke="#fff" stroke-width="2"/>
            <line x1="18" y1="6" x2="6" y2="18" stroke="#fff" stroke-width="2"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="skyline" aria-hidden="true"></div>

    <div class="body">
      <div class="stack" id="stack">
      </div>
    </div>
  </div>

  <script>
  const stack = document.getElementById('stack');
  const sessionId = (crypto.randomUUID && crypto.randomUUID()) || Math.random().toString(36).slice(2);

  /* Header controls */
  function scrollPanelToBottom(){
    const panel = document.querySelector('.body');
    if(panel){ panel.scrollTo({ top: panel.scrollHeight, behavior: 'smooth' }); }
  }

  const win = document.getElementById('win');
  const btnMax = document.getElementById('btn-max');
  const btnMin = document.getElementById('btn-min');
  const btnExit = document.getElementById('btn-exit');

  btnMax.addEventListener('click', ()=>{
    win.classList.add('max');
    btnMax.style.display='none';
    btnMin.style.display='';
  });
  btnMin.addEventListener('click', ()=>{
    win.classList.remove('max');
    btnMin.style.display='none';
    btnMax.style.display='';
  });
  btnExit.addEventListener('click', ()=>{
    try{
      if (window.parent && typeof window.parent.closeChatbot === 'function'){
        window.parent.closeChatbot();
        return;
      }
    }catch(e){}
    window.close();
  });

  /* Bubble with avatar on the right */
  function appendBot(html){
    const row = document.createElement('div');
    row.className = 'bubble-row';

    const avatar = document.createElement('div');
    avatar.className = 'bubble-avatar';
    avatar.innerHTML = `<img src="{{ url_for('static', filename='img/monogram-with-background.png') }}" alt="NU">`;

    const bubble = document.createElement('div');
    bubble.className = 'card';
    bubble.innerHTML = html;

    row.appendChild(avatar);
    row.appendChild(bubble);
    stack.appendChild(row);
    requestAnimationFrame(()=>scrollPanelToBottom());
  }

  /* Typing indicator with avatar */
  let typingRow = null;
  function showTyping(text='Assistant is typing'){
    if (typingRow) return;
    typingRow = document.createElement('div');
    typingRow.className = 'bubble-row';
    typingRow.innerHTML = `
      <div class="bubble-avatar">
        <img src="{{ url_for('static', filename='img/monogram-with-background.png') }}" alt="NU typing icon">
      </div>
      <div class="card typing">
        <span>${text}</span>
        <span class="dots"><span></span><span></span><span></span></span>
      </div>
    `;
    stack.appendChild(typingRow);
    scrollPanelToBottom();
  }
  function hideTyping(){ if (!typingRow) return; typingRow.remove(); typingRow = null; }

  async function post(url, payload){
    try{
      showTyping();
      const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const data = await res.json();
      hideTyping(); return data;
    }catch(e){ hideTyping(); console.error(e); return {}; }
  }

  /* Buttons container */
  function renderButtons(labels, handler){
    const row = document.createElement('div');
    row.className = 'row card';
    labels.forEach(lbl=>{
      const b = document.createElement('div');
      b.className = 'btn';
      b.textContent = lbl;
      b.onclick = ()=>{
        [...row.querySelectorAll('.btn')].forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        handler(lbl);
      };
      row.appendChild(b);
    });
    stack.appendChild(row);
    scrollPanelToBottom();
  }

  /* STATE used both client & server */
  let STATE = {
    session_id: sessionId,
    college: null,
    status: null,
    topic: null
  };

  let START_CACHE = null;

  async function init(){
    const data = await post('/api/v2/start', {session_id: STATE.session_id});
    STATE.college = null; STATE.status = null; STATE.topic = null;

    if (data.title) appendBot(`<h3 class="title">${data.title}</h3>`);
    if (data.intro){
      String(data.intro).split('<br>').map(s => s.trim()).filter(Boolean).forEach(part => {
        appendBot(`<p class="p">${part}</p>`);
      });
    }
    if (Array.isArray(data.colleges)) {
      START_CACHE = data;  // cache for inline Main Menu later
      renderButtons(data.colleges, onPickCollege);
    }
    if (data.disclaimer){
      appendBot(`<p class="disclaimer">${data.disclaimer}</p>`);
    }
  }

  function showMainMenuInline(){
    const colleges = (START_CACHE && Array.isArray(START_CACHE.colleges))
      ? START_CACHE.colleges
      : ["Incoming Student","Continuing Student"];
    appendBot(`<p class="p"><strong>Main Menu</strong> — choose an option to continue.</p>`);
    renderButtons(colleges, onPickCollege);
  }

  async function onPickCollege(lbl){
    STATE.college = lbl;
    const data = await post('/api/v2/college', {session_id: STATE.session_id, college: lbl});
    if (data.prompt) appendBot(`<p class="p">${data.prompt}</p>`);
    if (Array.isArray(data.statuses)) renderButtons(data.statuses, onPickStatus);
  }

  async function onPickStatus(lbl){
    STATE.status = lbl;
    const data = await post('/api/v2/status', {session_id: STATE.session_id, college: STATE.college, status: lbl});
    if (data.prompt) appendBot(`<p class="p">${data.prompt}</p>`);
    if (Array.isArray(data.topics)) renderButtons(data.topics, onPickTopic);
  }

  async function onPickTopic(lbl){
    STATE.topic = lbl;
    const data = await post('/api/v2/topic', {
      session_id: STATE.session_id,
      college: STATE.college,
      status: STATE.status,
      topic: lbl
    });
    if (data.answer){
      String(data.answer).split('<br>').map(s => s.trim()).filter(Boolean).forEach(part => {
        appendBot(`<p class="p">${part}</p>`);
      });
    }
    if (data.links && Array.isArray(data.links)){
      const listHtml = data.links.map(l => `<li><a href="${l.href}" target="_blank" rel="noopener">${l.label}</a></li>`).join('');
      appendBot(`<ul>${listHtml}</ul>`);
    }
    helpfulTail(lbl);
  }

  function onPickIncomingTopicOrBack(lbl){
    if (lbl === "Back to the Start") return startOver();
    STATE.topic = lbl;

    post('/api/v2/topic', {
      session_id: STATE.session_id,
      college: STATE.college,
      status: STATE.status,
      topic: lbl
    }).catch(()=>{});

    if (lbl === "Offer received – what are my next steps?"){
      appendBot(`<p class="p"><strong>After you receive your offer:</strong></p>`);
      appendBot(`<p class="p">1. Review your offer letter carefully, including program, start term, and any conditions.</p>`);
      appendBot(`<p class="p">2. Follow the instructions to accept your offer and pay any required deposit by the stated deadline.</p>`);
      appendBot(`<p class="p">3. Watch for emails from the Toronto campus with onboarding and pre-arrival information.</p>`);
      appendBot(`<p class="p"><strong>If anything in your offer is unclear, or if you see an error, please email:</strong> <a href="mailto:toronto@northeastern.edu">toronto@northeastern.edu</a></p>`);
      helpfulTail(lbl);
      return;
    }

    if (lbl === "When do I receive my timetable / class schedule?"){
      appendBot(`<p class="p"><strong>Class schedules are not sent immediately after you receive an offer.</strong></p>`);
      appendBot(`<p class="p">You will typically see your course schedule after:</p>`);
      appendBot(`<p class="p">1. You have accepted your offer and completed any required pre-registration steps.</p>`);
      appendBot(`<p class="p">2. You are enrolled in courses for your first term (this may involve registering yourself or being registered by your program).</p>`);
      appendBot(`<p class="p">3. Once enrolled, you will see your class times and locations in the student systems used by your program.</p>`);
      appendBot(`<p class="p"><strong>If you are unsure when you will receive your timetable, please email:</strong> <a href="mailto:toronto@northeastern.edu">toronto@northeastern.edu</a></p>`);
      helpfulTail(lbl);
      return;
    }

    appendBot(`<p class="p">For this topic, please email the Toronto campus team directly at <a href="mailto:toronto@northeastern.edu">toronto@northeastern.edu</a> so they can review your specific situation.</p>`);
    helpfulTail(lbl);
  }

  function logDeferralChoice(choice){
    post('/api/v2/deferral_choice', {
      session_id: STATE.session_id,
      college: STATE.college,
      status: STATE.status,
      topic: STATE.topic,
      choice
    }).catch(()=>{});
  }

  function helpfulTail(topic){
    appendBot(`<p class="p"><strong>Is there anything else you would like help with today?</strong></p>`);
    renderButtons(["Yes","No","Main Menu"], pick=>{
      if (pick === "Yes" || pick === "Main Menu") return showMainMenuInline();

      // Helpful?
      appendBot(`<p class="p"><strong>Was this information helpful?</strong></p>`);
      renderButtons(["Yes, it was helpful","No, I still need help","Main Menu"], fb=>{
        if (fb === "Main Menu") return showMainMenuInline();

        if (fb.startsWith("Yes")){
          // Positive path
          sendFeedback({helpful:true, topic});
          appendBot(`<p class="p">That’s Great! I’m glad we were able to provide the information you needed.</p>`);
          appendBot(`<p class="p"><strong>Is there anything else I can help you with today?</strong></p>`);
          return renderButtons(["Yes","No","Main Menu"], end=>{
            if (end === "Yes" || end === "Main Menu") return showMainMenuInline();
            appendBot(`<p class="p">I’m glad I was able to help ...ay and I look forward to having you back. Till next time!</p>`);
            renderButtons(["Main Menu"], ()=>showMainMenuInline());
          });
        }

        // Negative path
        const id = 'neg_' + Math.random().toString(36).slice(2);
        appendBot(`
          <div class="p" id="${id}">
            I’m sorry I couldn’t help you find what you were loo...ing for today. Please let me know what you feel needs improving.
            <div style="margin-top:6px">
              <label><input type="checkbox" value="incorrect"> Information is Incorrect</label><br/>
              <label><input type="checkbox" value="not_relevant"> Information is Not Relevant</label><br/>
              <label><input type="checkbox" value="unclear"> Information is Unclear</label><br/>
              <label><input type="checkbox" value="need_more_details"> I Need More Details</label>
            </div>
            <div style="margin-top:6px">
              <input type="text" placeholder="Optional: add a sh...idth:100%;padding:8px;border:1px solid #bbb;border-radius:8px"/>
            </div>
            <div class="row" style="margin-top:8px"><div class="btn" id="${id}_submit">Submit feedback</div></div>
          </div>
        `);
        setTimeout(()=>{
          const wrap=document.getElementById(id), btn=document.getElementById(id+'_submit');
          if(btn){
            btn.onclick=()=>{
              const reasons=[...wrap.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value);
              const note=wrap.querySelector('input[type="text"]').value||"";
              sendFeedback({helpful:false, topic, reasons, note});
              appendBot(`<p class="p">Thank you, your feedback h...e! I hope to be able to better support you in the future.</p>`);
              // After capturing negative feedback, restart from the welcome + main menu flow
              startOver();
            };
          }
        },0);
      });
    });
  }

  function sendFeedback(payload){
    const body = JSON.stringify({
      session_id: sessionId,
      status: STATE.status || "New Student",
      college: STATE.college || "N/A",
      ...payload
    });
    if (navigator.sendBeacon){
      try{
        navigator.sendBeacon('/api/v2/feedback', new Blob([body], {type:'application/json'}));
        return;
      }catch(e){}
    }
    fetch('/api/v2/feedback', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body
    }).catch(()=>{});
  }

  async function startOver(){
    const data = await post('/api/v2/start_over', {session_id: STATE.session_id});
    STATE = { session_id: STATE.session_id, college:null, status:null, topic:null };
    if (data.title) appendBot(`<h3 class="title">${data.title}</h3>`);
    if (data.intro){
      String(data.intro).split('<br>').map(s => s.trim()).filter(Boolean).forEach(part => {
        appendBot(`<p class="p">${part}</p>`);
      });
    }
    if (Array.isArray(data.colleges)) {
      START_CACHE = data;
      renderButtons(data.colleges, onPickCollege);
    }
  }

  window.addEventListener('beforeunload', ()=> {
    navigator.sendBeacon('/api/v2/feedback', new Blob([JSON.stringify({
      session_id: STATE.session_id, choice: 'end'
    })], {type:'application/json'}));
  });

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
