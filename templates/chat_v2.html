<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NEU Toronto Assistant – v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
  :root{
    --cm: 37.8px; /* 1cm ≈ 37.8px */
    --neu-red:#C8102E; --text:#111;
    --muted:#555; --border:#ddd; --bg:#f6f6f6;
    --accent:#004990; --accent-soft:#e5f0ff;
    --shadow:0 6px 20px rgba(0,0,0,.15);
    --radius:10px;
    --btn-radius:999px;
    --header-h: calc(1.1 * var(--cm));
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family: 'Lato', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    color:var(--text);
  }

  /* Outer "card" window */
  .window{
    width: 100%;
    max-width: 350px;
    margin: 8px auto;     /* NEW: center nicely inside the frame */
    /* min-height removed to avoid extra white space */
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    position: relative;
    overflow: hidden;
    transition: width .2s ease, height .2s ease, max-height .2s ease;
  }

  .header{
    display:flex;
    align-items:center;
    gap:calc(0.4 * var(--cm));
    padding:calc(0.4 * var(--cm)) calc(0.5 * var(--cm));
    border-bottom:1px solid var(--border);
    background: linear-gradient(120deg,#fef6f7,#fff);
    min-height: var(--header-h);
  }
  .logo-wrap{
    width:calc(1.4 * var(--cm));
    height:calc(1.4 * var(--cm));
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-wrap img{
    width:100%;
    height:auto;
    display:block;
    border-radius:6px;
  }
  .header-text{ flex:1; min-width:0; }
  .title{
    font-size:14px;
    font-weight:800;
    color:#000;
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  .subtitle{
    font-size:11px;
    color:var(--muted);
    line-height:1.3;
  }

  .header-actions{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:2px;
    margin-left:6px;
  }

  .tag{
    font-size:9px;
    padding:2px 6px;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:600;
    white-space:nowrap;
  }

  .win-controls{
    display:flex;
    gap:2px;
    margin-top:2px;
  }
  .icon-btn{
    width:18px; height:18px;
    border-radius:50%;
    border:none;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:11px;
    line-height:1;
    padding:0;
  }
  .icon-btn span{ transform:translateY(-1px); }
  #btn-max{ background:#e8f0ff; color:#004990; }
  #btn-min{ background:#fce9e9; color:#b00020; }
  #btn-exit{
    width:auto;
    padding:0 8px;
    border-radius:999px;
    font-size:10px;
    background:#f4f4f4;
    color:#333;
  }
  #btn-exit span{ transform:none; }

  .body{
    position: relative;
    padding: calc(0.5 * var(--cm));
    padding-top: calc(0.75 * var(--cm));
    max-height: calc(12 * var(--cm));
    overflow-y: auto;
    overflow-x: hidden;   /* NEW */
  }

  .body::-webkit-scrollbar{
    width:6px;
  }
  .body::-webkit-scrollbar-thumb{
    background:#ccc;
    border-radius:999px;
  }

  .stack{ min-height: 0; padding-bottom: calc(0.5 * var(--cm)); }

  /* === Chat bubble row with avatar (N beside every bot bubble) === */
  .bubble-row{
    display:flex; justify-content:flex-end; align-items:flex-start;
    gap: calc(0.25 * var(--cm));
    margin-bottom: calc(0.3 * var(--cm));
  }
  .bubble-avatar{
    width:24px; height:24px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:1px solid #eee;
  }
  .bubble-avatar img{
    width:100%; height:100%; object-fit:cover;
  }
  .card{
    background:#fff;
    border-radius:12px;
    border:1px solid var(--border);
    padding:8px 10px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    font-size:11px;
    line-height:1.45;
    max-width: 240px;
    color:#111;
    text-align:left;   /* NEW: align text left for readability */
  }

  .p{ margin-bottom:6px; font-size:11px; line-height:1.5; color:#222; }

  .p strong{ font-weight:700; }
  .p a{ color:var(--accent); text-decoration:none; }
  .p a:hover{ text-decoration:underline; }

  .row{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:4px;
  }

  .btn{
    font-size:11px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid #ccc;
    background:#fafafa;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .btn:hover{
    background:#f0f0f0;
    transform:translateY(-0.5px);
    box-shadow:0 2px 5px rgba(0,0,0,.12);
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .btn-primary:hover{
    background:#003369;
  }

  .btn-secondary{
    background:#fff;
    color:#333;
  }

  /* Small heading inside cards */
  .card h3{
    font-size:11px;
    margin-bottom:3px;
    font-weight:700;
  }

  .tagline{
    font-size:10px;
    color:#777;
    margin-top:3px;
  }

  /* You bubble (user) */
  .you{
    align-self:flex-end;
    background:#ebf4ff;
    border-color:#c4dcff;
  }
  .you .p{ color:#123; }

  /* Quick categories / sections */
  .section-title{
    font-weight:700;
    font-size:11px;
    margin:6px 0 4px;
  }

  /* Kebab menu area (future use if needed) */
  .kebab-wrap{
    position:absolute;
    top:6px;
    right:6px;
  }

  .typing{
    display:inline-block;
    padding:2px 0;
    color:#999;
    font-size:10px;
  }

  /* Tiny icon in header title (location pin) */
  .title-row{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .title-row svg{
    width:12px; height:12px;
    flex-shrink:0;
  }

  .meta-line{
    font-size:9px;
    color:#999;
    margin-top:2px;
  }

  /* Prevent text selection glitches */
  .btn, a{ -webkit-tap-highlight-color: transparent; }

  /* Make sure long content wraps nicely */
  .card p, .card li{
    word-wrap:break-word;
    word-break:break-word;
  }

  /* Simple list styling inside card */
  ul{
    padding-left:18px;
    margin:4px 0;
  }
  li{
    margin-bottom:2px;
  }

  /* Radio group styling for deferrals / arrivals etc. */
  .options-label{
    font-size:10px;
    margin-bottom:4px;
    color:#444;
  }
  .options-group{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:3px;
  }
  .options-group label{
    font-size:10px;
    display:flex;
    align-items:center;
    gap:3px;
  }
  .options-group input[type="radio"]{
    transform:scale(0.9);
  }

  /* Responsive tweak: at very small widths, reduce padding */
  @media (max-width:360px){
    .window{
      margin:4px auto;
    }
    .body{
      padding:8px;
      padding-top:10px;
    }
  }

  /* Add a gentle background behind the whole window (but keep transparent page) */
  :root{ --white:#ffffff; }

  /* New: subtle "NEU" watermark style (used in header title icon) */
  .icon-n{
    display:inline-block;
    font-size:9px;
    font-weight:900;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  /* For the “typing” bubble row */
  .typing-row{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:4px;
  }
  .typing-dots span{
    display:inline-block;
    width:4px; height:4px;
    border-radius:50%;
    background:#bbb;
    margin-right:3px;
    animation:blink 1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.2s; }
  .typing-dots span:nth-child(3){ animation-delay:.4s; }

  @keyframes blink{
    0%, 20%{ opacity:0.2; transform:translateY(0); }
    50%{ opacity:1; transform:translateY(-1px); }
    100%{ opacity:0.2; transform:translateY(0); }
  }

  /* Ensure buttons wrap cleanly inside card width */
  .row .btn{
    max-width:100%;
  }

  /* Little "powered by" footer (if needed later) */
  .footer-note{
    font-size:9px;
    color:#999;
    text-align:right;
    margin-top:4px;
  }

  /* Keep the card pinned visually to top of window when little content */
  .body-inner{
    min-height:0;
  }

  /* NEW: ensure scrollable region stops before window edge */
  #win{
    max-height: calc(14 * var(--cm));
  }

  /* Fine–tune header text when wrapping */
  .title-row .label{
    white-space:nowrap;
  }

  .subtitle strong{
    font-weight:700;
    color:#333;
  }

  /* “Toronto Campus” pill */
  .campus-pill{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:#fff;
    border-radius:999px;
    padding:2px 8px;
    border:1px solid #e0e0e0;
    font-size:9px;
    margin-top:2px;
  }
  .campus-pill span.icon{
    width:12px; height:12px;
    border-radius:50%;
    background:#c8102e;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:8px;
  }

  /* Tiny chevron beside Main Menu if we use it */
  .btn .chevron{
    font-size:9px;
    margin-left:2px;
  }

  /* Ensure radio buttons not squashed */
  .card .row-options{
    flex-wrap:wrap;
    gap:6px;
  }

  /* Hide native scrollbars in Firefox just a bit */
  .body{
    scrollbar-width:thin;
    scrollbar-color:#ccc transparent;
  }
  </style>
</head>
<body>
  <div class="window" id="win">
    <div class="header">
      <div class="logo-wrap">
        <img src="{{ url_for('static', filename='img/monogram-with-background.png') }}" alt="Northeastern University Toronto logo">
      </div>
      <div class="header-text">
        <div class="title-row">
          <span class="icon-n">NU</span>
          <span class="label">Toronto Campus Assistant</span>
        </div>
        <div class="subtitle">
          One-stop assistant for <strong>Toronto</strong> student life questions.
        </div>
        <div class="campus-pill">
          <span class="icon">T</span>
          <span>Toronto Campus</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="tag">Beta · v2</div>
        <div class="win-controls">
          <button class="icon-btn" id="btn-max" title="Maximize chatbot"><span>⬜</span></button>
          <button class="icon-btn" id="btn-min" title="Minimize chatbot"><span>▁</span></button>
        </div>
        <button class="icon-btn" id="btn-exit" title="Close chatbot"><span>Exit</span></button>
      </div>
    </div>

    <div class="body">
      <div class="body-inner">
        <div class="stack" id="stack">
          <!-- Chat bubbles injected here -->
        </div>
      </div>
    </div>
  </div>

  <script>
  // === Simple state to keep track of student type & college ===
  const STATE = {
    status: null,
    college: null
  };

  // Synthetic session id for feedback mapping
  const sessionId = (Math.random().toString(36).slice(2) + Date.now().toString(36));

  const stack = document.getElementById('stack');

  function scrollPanelToBottom(){
    const panel = document.querySelector('.body');
    if(panel){ panel.scrollTo({ top: panel.scrollHeight, behavior: 'smooth' }); }
  }

  const win = document.getElementById('win');
  const btnMax = document.getElementById('btn-max');
  const btnMin = document.getElementById('btn-min');
  const btnExit = document.getElementById('btn-exit');

  btnMax.addEventListener('click', ()=>{
    win.style.maxWidth = '100%';
    win.style.width = '100%';
    win.style.maxHeight = 'none';
    btnMax.style.display = 'none';
    btnMin.style.display = 'inline-block';
  });
  btnMin.addEventListener('click', ()=>{
    win.style.maxWidth = '350px';
    win.style.width = '100%';
    win.style.maxHeight = 'calc(14 * var(--cm))';
    btnMin.style.display = 'none';
    btnMax.style.display = 'inline-block';
  });
  btnExit.addEventListener('click', ()=>{ window.history.back(); });

  /* Bubble helpers (avatar + bubble) — PRESERVED */
  function appendBot(html){
    const row = document.createElement('div');
    row.className = 'bubble-row';

    const avatar = document.createElement('div');
    avatar.className = 'bubble-avatar';
    avatar.innerHTML = `<img src="{{ url_for('static', filename='img/monogram-with-background.png') }}" alt="NU">`;

    const bubble = document.createElement('div');
    bubble.className = 'card';
    bubble.innerHTML = html;

    row.appendChild(avatar);
    row.appendChild(bubble);
    stack.appendChild(row);
    requestAnimationFrame(()=>scrollPanelToBottom());
  }

  /* Typing indicator with avatar — PRESERVED */
  let typingRow = null;
  function showTyping(text='Assistant is typing'){
    if (typingRow) return;
    typingRow = document.createElement('div');
    typingRow.className = 'bubble-row';
    typingRow.innerHTML = `
      <div class="bubble-avatar">
        <img src="{{ url_for('static', filename='img/monogram-with-background.png') }}" alt="NU typing icon">
      </div>
      <div class="card">
        <div class="typing-row">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <span class="typing">${text}</span>
        </div>
      </div>
    `;
    stack.appendChild(typingRow);
    scrollPanelToBottom();
  }
  function hideTyping(){
    if (!typingRow) return;
    typingRow.remove();
    typingRow = null;
  }

  function appendYou(text){
    const row = document.createElement('div');
    row.className = 'bubble-row';
    const bubble = document.createElement('div');
    bubble.className = 'card you';
    bubble.innerHTML = `<p class="p">${text}</p>`;
    row.appendChild(bubble);
    stack.appendChild(row);
    scrollPanelToBottom();
  }

  /* Render a row of buttons, reusing the "row" + "btn" styles */
  function renderButtons(labels, onClick){
    const row = document.createElement('div');
    row.className = 'row';
    labels.forEach(label=>{
      const btn = document.createElement('div');
      btn.className = 'btn';
      btn.textContent = label;
      btn.addEventListener('click', ()=>{
        onClick(label);
      });
      row.appendChild(btn);
    });
    stack.appendChild(row);
    scrollPanelToBottom();
  }

  /* First question: status selection, then update STATE.status */
  function askStatus(){
    appendBot(`<p class="p"><strong>Welcome! Let’s get started.</strong><br/>First, how would you describe your status?</p>`);
    renderButtons(
      ["New Student","Current Student","Alumni","Prospective Student","Faculty/Staff","Other"],
      choice=>{
        STATE.status = choice;             // store status
        appendYou(choice);
        askCollege();                      // next: college
      }
    );
  }

  /* Second question: college selection, then update STATE.college */
  function askCollege(){
    appendBot(`<p class="p">Thanks! Which Northeastern college is most relevant to your question?</p>`);
    renderButtons(
      ["CPS (College of Professional Studies)",
       "COE (College of Engineering)",
       "COS (College of Science)",
       "DMSB (D’Amore-McKim School of Business)",
       "Other / Not Sure"],
      choice=>{
        appendYou(choice);
        if (choice.includes("CPS")) STATE.college = "CPS";
        else if (choice.includes("COE")) STATE.college = "COE";
        else if (choice.includes("COS")) STATE.college = "COS";
        else if (choice.includes("DMSB")) STATE.college = "DMSB";
        else STATE.college = "Other";

        showMainMenu();
      }
    );
  }

  function showMainMenu(){
    appendBot(`
      <p class="p"><strong>How can I help you today?</strong></p>
      <p class="p">Select the option that best matches your question. You can always come back to this menu.</p>
    `);
    renderButtons(
      [
        "New Student Onboarding",
        "Course Registration & Planning",
        "Fees, Payments & Funding",
        "Immigration, Study Permit & Travel",
        "Career Services & Co-op/Internships",
        "Deferrals & Late Arrivals",
        "Campus Life & Student Support",
        "Technical / Systems Support",
        "Graduation & Program Completion",
        "Other / Not Listed"
      ],
      handleMainSelection
    );
  }

  function showMainMenuInline(){
    appendBot(`<p class="p"><strong>Back to main menu.</strong><br/>How else can I help you today?</p>`);
    renderButtons(
      [
        "New Student Onboarding",
        "Course Registration & Planning",
        "Fees, Payments & Funding",
        "Immigration, Study Permit & Travel",
        "Career Services & Co-op/Internships",
        "Deferrals & Late Arrivals",
        "Campus Life & Student Support",
        "Technical / Systems Support",
        "Graduation & Program Completion",
        "Other / Not Listed"
      ],
      handleMainSelection
    );
  }

  function handleMainSelection(label){
    appendYou(label);

    if (label === "New Student Onboarding")      return topicNewStudent();
    if (label === "Course Registration & Planning") return topicRegistration();
    if (label === "Fees, Payments & Funding")   return topicFees();
    if (label === "Immigration, Study Permit & Travel") return topicImmigration();
    if (label === "Career Services & Co-op/Internships") return topicCareer();
    if (label === "Deferrals & Late Arrivals")  return topicDeferrals();
    if (label === "Campus Life & Student Support") return topicCampusLife();
    if (label === "Technical / Systems Support") return topicTechSupport();
    if (label === "Graduation & Program Completion") return topicGraduation();
    if (label === "Other / Not Listed") return topicOther();
  }

  /* ========== TOPIC HANDLERS ========== */
  function topicNewStudent(){
    const topic = "New Student Onboarding";
    appendBot(`
      <p class="p"><strong>New Student Onboarding – Toronto Campus</strong></p>
      <p class="p">Here are some popular areas new students ask about:</p>
      <ul>
        <li>Next steps after receiving your offer & paying your deposit</li>
        <li>Setting up your online accounts (myNortheastern, NU email, MFA, etc.)</li>
        <li>Understanding your program start date & orientation</li>
        <li>Finding your class schedule and key academic dates</li>
      </ul>
      <p class="p">Please choose what you’d like to explore:</p>
    `);
    renderButtons(
      [
        "I’m newly admitted – what are my next steps?",
        "How do I find my program and course start dates?",
        "How do I activate my Northeastern accounts?",
        "Where do I see my timetable / class schedule?",
        "Main Menu"
      ],
      choice=>{
        appendYou(choice);
        if (choice === "Main Menu") return showMainMenuInline();
        appendBot(`
          <p class="p"><strong>For detailed & up-to-date onboarding steps:</strong></p>
          <p class="p">
            Please visit the official Toronto campus site:<br/>
            <a href="https://toronto.northeastern.edu/student-life/" target="_blank" rel="noopener">Toronto Student Life – Getting Started</a>
          </p>
          <p class="p">
            For individualized support (program-specific questions, start dates, orientation details), please email:<br/>
            <strong><a href="mailto:toronto@northeastern.edu">toronto@northeastern.edu</a></strong>
          </p>
        `);
        helpfulTail(topic);
      }
    );
  }

  function topicRegistration(){
    const topic = "Course Registration & Planning";
    appendBot(`
      <p class="p"><strong>Course Registration & Planning</strong></p>
      <p class="p">Common questions include:</p>
      <ul>
        <li>When and how to register for courses</li>
        <li>Who approves your study plan</li>
        <li>Adding/dropping courses or swapping sections</li>
        <li>Understanding full-time load and prerequisites</li>
      </ul>
      <p class="p">Please select what best matches your question.</p>
    `);
    renderButtons(
      [
        "When can I register for courses?",
        "How do I build my course plan?",
        "I need help adding/dropping a course",
        "Who do I contact for academic advising?",
        "Main Menu"
      ],
      choice=>{
        appendYou(choice);
        if (choice === "Main Menu") return showMainMenuInline();
        appendBot(`
          <p class="p">
            For official registration timelines and instructions, please refer to:<br/>
            <a href="https://registrar.northeastern.edu/article/registration-information/" target="_blank" rel="noopener">
              Northeastern Registrar – Registration Information
            </a>
          </p>
          <p class="p">
            For program-specific academic advising or support with your plan, please email:<br/>
            <strong><a href="mailto:torontoacademicadvising@northeastern.edu">torontoacademicadvising@northeastern.edu</a></strong>
          </p>
        `);
        helpfulTail(topic);
      }
    );
  }

  function topicFees(){
    const topic = "Fees, Payments & Funding";
    appendBot(`
      <p class="p"><strong>Fees, Payments & Funding</strong></p>
      <p class="p">What would you like help with?</p>
    `);
    renderButtons(
      [
        "Tuition & fee amounts",
        "Payment deadlines and methods",
        "Late payment / holds",
        "Scholarships or assistantships",
        "Main Menu"
      ],
      choice=>{
        appendYou(choice);
        if (choice === "Main Menu") return showMainMenuInline();
        appendBot(`
          <p class="p">
            For official tuition, fees, and billing details, please see Student Financial Services:<br/>
            <a href="https://studentfinance.northeastern.edu" target="_blank" rel="noopener">
              studentfinance.northeastern.edu
            </a>
          </p>
          <p class="p">
            For Toronto-specific tuition or payment questions, you can email:<br/>
            <strong><a href="mailto:toronto@northeastern.edu">toronto@northeastern.edu</a></strong>
          </p>
        `);
        helpfulTail(topic);
      }
    );
  }

  function topicImmigration(){
    const topic = "Immigration, Study Permit & Travel";
    appendBot(`
      <p class="p"><strong>Immigration, Study Permit & Travel</strong></p>
      <p class="p">
        Immigration rules can change, and every case is unique. For accurate guidance, it’s important to refer to official sources.
      </p>
      <p class="p">What would you like to ask about?</p>
    `);
    renderButtons(
      [
        "Study permit application or extension",
        "TRV / visa stamping questions",
        "Travel to Canada and port-of-entry",
        "Co-op work permit / PGWP",
        "Main Menu"
      ],
      choice=>{
        appendYou(choice);

  /* === Helpful tail with feedback (POS + NEG) === */
  function helpfulTail(topic){
    appendBot(`<p class="p"><strong>Is there anything else you would like help with today?</strong></p>`);
    renderButtons(["Yes","No","Main Menu"], pick=>{
      if (pick === "Yes" || pick === "Main Menu") return showMainMenuInline();

      // Helpful?
      appendBot(`<p class="p"><strong>Was this information helpful?</strong></p>`);
      renderButtons(["Yes, it was helpful","No, I still need help","Main Menu"], fb=>{
        if (fb === "Main Menu") return showMainMenuInline();

        if (fb.startsWith("Yes")){
          // Positive path
          sendFeedback({helpful:true, topic});
          appendBot(`<p class="p">That’s Great! I’m glad we were able to provide the information you needed.</p>`);
          appendBot(`<p class="p"><strong>Is there anything else I can help you with today?</strong></p>`);
          return renderButtons(["Yes","No","Main Menu"], end=>{
            if (end === "Yes" || end === "Main Menu") return showMainMenuInline();
            appendBot(`<p class="p">I’m glad I was able to help ...ay and I look forward to having you back. Till next time!</p>`);
            renderButtons(["Main Menu"], ()=>showMainMenuInline());
          });
        }

        // Negative path
        const id = 'neg_' + Math.random().toString(36).slice(2);
        appendBot(`
          <div class="p" id="${id}">
            I’m sorry I couldn’t help you find what you were loo...ing for today. Please let me know what you feel needs improving.
            <div style="margin-top:6px">
              <label><input type="checkbox" value="incorrect"> Information is Incorrect</label><br/>
              <label><input type="checkbox" value="not_relevant"> Information is Not Relevant</label><br/>
              <label><input type="checkbox" value="unclear"> Information is Unclear</label><br/>
              <label><input type="checkbox" value="need_more_details"> I Need More Details</label>
            </div>
            <div style="margin-top:6px">
              <input type="text" placeholder="Optional: add a sh...idth:100%;padding:8px;border:1px solid #bbb;border-radius:8px"/>
            </div>
            <div class="row" style="margin-top:8px"><div class="btn" id="${id}_submit">Submit feedback</div></div>
          </div>
        `);
        setTimeout(()=>{
          const wrap=document.getElementById(id), btn=document.getElementById(id+'_submit');
          const noteInput = wrap ? wrap.querySelector('input[type="text"]') : null;
          const NUMBER_WORDS = /\b(zero|one|two|three|four|five|six|seven|eight|nine|ten)\b/gi;
          if (noteInput){
            noteInput.addEventListener('input', ()=>{
              let v = noteInput.value || "";
              v = v.replace(/\d+/g,'');
              v = v.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten)\b/gi,'');
              noteInput.value = v;
            });
          }
          if(btn){
            btn.onclick=()=>{
              const reasons=[...wrap.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value);
              let rawNote="";
              if (noteInput){
                rawNote = noteInput.value || "";
              } else {
                const noteField = wrap.querySelector('input[type="text"]');
                rawNote = noteField ? (noteField.value || "") : "";
              }
              if (/\d{4,}/.test(rawNote) || NUMBER_WORDS.test(rawNote) || /nuid/i.test(rawNote)){
                alert("For your privacy, please do not include ID numbers here.");
                NUMBER_WORDS.lastIndex = 0;
                return;
              }
              const note=rawNote;
              sendFeedback({helpful:false, topic, reasons, note});
              appendBot(`<p class="p">Thank you, your feedback h...e! I hope to be able to better support you in the future.</p>`);
              appendBot(`<p class="p"><strong>Anything else I can help with today?</strong></p>`);
              renderButtons(["Yes","No","Main Menu"], end=>{
                if (end === "Yes" || end === "Main Menu") return showMainMenuInline();
                appendBot(`<p class="p">Okay — I’m here whenever you need me.</p>`);
                renderButtons(["Main Menu"], ()=>showMainMenuInline());
              });
            };
          }
        },0);
      });
    });
  }

  // Use the actual selected status (no hard-coded label)
  function sendFeedback(payload){
    const body = JSON.stringify({
      session_id: sessionId,
      status: STATE.status || "New Student",
      college: STATE.college || "N/A",
      ...payload
    });
    if (navigator.sendBeacon){
      try{ navigator.sendBeacon('/api/v2/feedback', new Blob([body],{type:'application/json'})); return; }catch(e){}
    }
    fetch('/api/v2/feedback',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body
    }).catch(()=>{});
  }
