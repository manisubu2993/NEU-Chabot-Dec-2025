<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Support Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
  :root{
    --cm: 37.8px; /* 1cm ≈ 37.8px */
    --brand-red:#C8102E; --text:#111; --muted:#666; --border:#DBDBDB; --white:#FFF;
    --bubble-w: 7.2;        /* cm */
    --bubble-r-offset: 0.3;  /* cm from right wall */
    --bubble-v-gap: 0.3;     /* cm vertical gap */
    --bubble-radius: 0.25;   /* cm */
    --btn-h: 0.8;            /* cm */
    --btn-w: 7.0;           /* cm */
  }
  *{box-sizing:border-box}
 body{
  margin:0;
  background:#f5f5f5;
  color:var(--text);
  font-family:'Lato',system-ui,-apple-system,Arial,sans-serif;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  min-height:100vh;
  padding:0;
  overflow-x:hidden;
}
  .window{
  width: 100%;
  max-width: 350px;
  margin: 8px auto;
  min-height: calc(14 * var(--cm));
  height: auto;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,.12);
  position: relative;
  overflow: hidden;
  transition: width .2s ease, height .2s ease, max-height .2s ease;
}

  .window.maximized{
    width: min(100vw - 48px, 1200px);
    height: min(100vh - 48px, 900px);
  }

  .header{
    position: sticky; top: 0; z-index: 5;
    height: calc(3 * var(--cm)); background: #000;
    display:flex; align-items:center; padding: 0 calc(0.5 * var(--cm));
    border-bottom: 1px solid #000;
  }
  .header .logo{ height: calc(1 * var(--cm)); margin-left: calc(1.25 * var(--cm)); }
 .header .actions{
  margin-left: auto;
  display: none;
  gap:12px;
  position: relative;
  right: calc(0.25 * var(--cm));
}
  .icon-btn{ width: calc(0.5 * var(--cm)); height: calc(0.5 * var(--cm)); cursor:pointer; user-select:none; display:block; }
  .icon-btn svg{ width:100%; height:100%; display:block; fill:#fff; }

  .skyline{
    position:absolute; left:0; right:0; bottom:0;
    height: calc(11 * var(--cm));
    background: url("{{ url_for('static', filename='skyline.jpg') }}") center/cover no-repeat;
    opacity:.05; pointer-events:none;
  }

  .body{
  position: relative;
  padding: calc(0.5 * var(--cm));
  padding-top: calc(0.75 * var(--cm));
  padding-bottom: 0;
  max-height: calc(12 * var(--cm));
  overflow-y: auto;
  overflow-x: hidden;
}
  .stack{ min-height: calc(8 * var(--cm)); padding-bottom: calc(0.5 * var(--cm)); }

  .bubble-row{
    display:flex; justify-content:flex-end; align-items:flex-start;
    gap: calc(0.25 * var(--cm));
    margin-right: calc(var(--bubble-r-offset) * var(--cm)); margin-left: calc(var(--bubble-r-offset) * var(--cm));
    margin-top: calc(var(--bubble-v-gap) * var(--cm));
  }
  .stack > .bubble-row:first-of-type{ margin-top: calc(1.3 * var(--cm)); }

  .bubble-avatar{
    flex: 0 0 calc(1.0 * var(--cm));
    width: calc(0.9 * var(--cm)); height: calc(0.9 * var(--cm));
    border-radius:50%; overflow:hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .bubble-avatar img{ width:100%; height:100%; display:block; object-fit:cover; }

  .card{
  background: var(--white); border:1px solid var(--border);
  border-radius: calc(var(--bubble-radius) * var(--cm));
  width: 100%;
  max-width: 100%;
  padding: 14px 16px; box-shadow: 0 1px 0 rgba(0,0,0,.03);
  line-height: 1.45;
}

  .title{ color:var(--brand-red); font-weight:700; font-size:20px; margin:0 0 6px 0; }
  .p{ margin:0; font-size:13px; color:var(--text); }

  .typing{ display:flex; align-items:center; gap:6px; color:var(--muted); }
  .typing .dots{ display:inline-flex; gap:4px; }
  .typing .dots span{
    width:6px; height:6px; border-radius:50%; background:#bbb; display:block; animation:bounce 1s infinite ease-in-out;
  }
  .typing .dots span:nth-child(2){ animation-delay:.15s }
  .typing .dots span:nth-child(3){ animation-delay:.3s }

  @keyframes bounce{ 
    0%,80%,100%{transform:translateY(0);opacity:.6} 
    40%{transform:translateY(-4px);opacity:1} 
  }

  .row.card{
  width: 100%;
  max-width: 100%;
  margin-left: auto; margin-right: calc(var(--bubble-r-offset) * var(--cm)); margin-left: calc(var(--bubble-r-offset) * var(--cm));
  margin-top: calc(var(--bubble-v-gap) * var(--cm));
  border:1px solid var(--border);
  border-radius: calc(var(--bubble-radius) * var(--cm));
  padding: calc(0.3 * var(--cm));
  box-shadow: 0 1px 0 rgba(0,0,0,.03);
  background: var(--white);
}

  .row{ display:flex; flex-wrap:wrap; gap: calc(0.2 * var(--cm)); align-items:center; }
  .btn{
    display:inline-block; height: calc(var(--btn-h) * var(--cm)); width: calc(var(--btn-w) * var(--cm));
    line-height: calc(var(--btn-h) * var(--cm)); padding:0 16px; border:1px solid #000; border-radius: calc(0.25 * var(--cm));
    background:#fff; color:var(--brand-red); text-align:center; font-size:14px; cursor:pointer; user-select:none;
    transition: transform .06s ease, box-shadow .12s ease;
  }
  .btn:hover{ font-weight:700; font-style: italic; }
  .btn.selected{ background: var(--brand-red); color:#fff; font-weight:700; }

  .footerpad{ height:18px; }

  </style>
</head>
<body>
<div class="window" id="win">
  <div class="header">
    <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="University logo">
        <div class="actions">
      <span id="btn-max" class="icon-btn" title="Maximize">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="5" width="14" height="14" fill="none" stroke="#fff" stroke-width="2"/>
        </svg>
      </span>
      <span id="btn-min" class="icon-btn" title="Minimize" style="display:none;">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" fill="none" stroke="#fff" stroke-width="2"/>
        </svg>
      </span>
      <span id="btn-exit" class="icon-btn" title="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6 L18 18 M18 6 L6 18" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </span>
    </div>
  </div>

  <div class="skyline" aria-hidden="true"></div>

  <div class="body">
    <div id="stack" class="stack"></div>
    <div class="footerpad"></div>
  </div>
</div>

<script>


  const stack = document.getElementById('stack');
  // Step 7: Exact Resume (non-breaking, add-only)
  const LS_KEY = 'ssa_v2_resume_state';

  function _loadLS(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); }catch(e){ return null; }
  }
  function _saveLS(obj){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(obj||null)); }catch(e){}
  }
  function _clearLS(){
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
  }
  function _newSessionId(){
    return (crypto.randomUUID && crypto.randomUUID()) || Math.random().toString(36).slice(2);
  }

  const _LS0 = _loadLS();
  let sessionId = (_LS0 && _LS0.session_id) ? _LS0.session_id : _newSessionId();

  // Step 6 Enhanced (admin/demo): enable admin controls with ?admin=1
  const ADMIN_MODE = (new URLSearchParams(window.location.search).get('admin') === '1');
  const ESCALATION_EMAIL = 'g.subramanian@northeastern.edu';


  function scrollPanelToBottom(){
    const panel = document.querySelector('.body');
    if(panel){
      panel.scrollTo({ top: panel.scrollHeight, behavior: 'smooth' });
    }
  }

  const win = document.getElementById('win');
  const btnMax = document.getElementById('btn-max');
  const btnMin = document.getElementById('btn-min');
  const btnExit = document.getElementById('btn-exit');

  if(btnMax){
  btnMax.addEventListener('click', ()=>{
    win.classList.add('maximized');
    btnMax.style.display = 'none';
    btnMin.style.display = 'inline-block';
  });
}
if(btnMin){
  btnMin.addEventListener('click', ()=>{
    win.classList.remove('maximized');
    btnMin.style.display = 'none';
    btnMax.style.display = 'inline-block';
  });
}
if(btnExit){
  btnExit.addEventListener('click', ()=>{
    window.history.back();
  });
}
function appendBot(html){
    const row = document.createElement('div');
    row.className = 'bubble-row';

    const avatar = document.createElement('div');
    avatar.className = 'bubble-avatar';
    avatar.innerHTML =
      `<img src="{{ url_for('static', filename='img/monogram-with-background.png') }}" alt="NU">`;

    const bubble = document.createElement('div');
    bubble.className = 'card';
    bubble.innerHTML = html;

    row.appendChild(avatar);
    row.appendChild(bubble);
    stack.appendChild(row);

    requestAnimationFrame(()=>{
      scrollPanelToBottom();
    });
  }

  let typingRow = null;
  function showTyping(text='Assistant is typing'){
    if(typingRow) return;

    typingRow = document.createElement('div');
    typingRow.className = 'bubble-row';

    typingRow.innerHTML = `
      <div class="bubble-avatar">
        <img src="{{ url_for('static', filename='img/monogram-with-background.png') }}" alt="NU">
      </div>
      <div class="card typing">
        <span>${text}</span>
        <span class="dots">
          <span></span><span></span><span></span>
        </span>
      </div>
    `;

    stack.appendChild(typingRow);
    scrollPanelToBottom();
  }

  function hideTyping(){
    if(!typingRow) return;
    typingRow.remove();
    typingRow = null;
  }

  async function post(url, payload){
    try{
      showTyping();
      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      hideTyping();
      return data;
    } catch(e){
      hideTyping();
      console.error(e);
      return {};
    }

  function getSelectedNegativeReasons(){
    const reasons = [];

    // 1) Checkbox list
    document.querySelectorAll('.neg-reason input[type="checkbox"]:checked').forEach(cb=>{
      const lbl = cb.closest('.neg-reason')?.querySelector('.neg-label')?.textContent?.trim();
      if(lbl) reasons.push(lbl);
    });

    // 2) Active/selected option items
    if(reasons.length === 0){
      document.querySelectorAll('.neg-option.active, .neg-option.selected').forEach(el=>{
        const t = el.textContent?.trim();
        if(t) reasons.push(t);
      });
    }

    // 3) Hidden input fallback
    if(reasons.length === 0){
      const hidden = document.querySelector('#negReason, #neg_reason, input[name="negReason"]');
      const v = hidden ? (hidden.value||'').trim() : '';
      if(v) reasons.push(v);
    }

    return reasons;
  }

  }

  function renderButtons(labels, handler){
    const row = document.createElement('div');
    row.className = 'row card';

    labels.forEach(lbl=>{
      const b = document.createElement('div');
      b.className = 'btn';
      b.textContent = lbl;

      b.onclick = ()=>{
        [...row.querySelectorAll('.btn')]
          .forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        handler(lbl);
      };

      row.appendChild(b);
    });

    stack.appendChild(row);
    scrollPanelToBottom();
  }

  // --- Step 3: Fix-It Troubleshooter (Decision-Tree AI, no LLM) ---
  // Non-breaking helper: presents a small decision-tree panel inside the chat stream.
  function showTroubleshooter(topicName, question, options){
    appendBot(`<p class="p"><strong>${topicName}</strong><br>${question}</p>`);

    const labels = options.map(o=>o.label).concat(["Main Menu"]);
    renderButtons(labels, choice=>{
      if(choice==="Main Menu") return showMainMenuInline();
      const opt = options.find(o=>o.label===choice);
      if(!opt) return showMainMenuInline();
      appendBot(opt.html);
      helpfulTail(topicName);
    });
  }

  const linkBtn = (text, href)=>
    `<a class="link" target="_blank" rel="noopener" href="${href}">${text}</a>`;

  let STATE = {
    session_id: sessionId,
    college: null,
    status: null,
    topic: null,
    checkpoint: 'start',      // start | college | status | topic | ticket_tracking
    ticket_id: null,          // preserves Step 6 ticket lifecycle on refresh
    ticket_prompted: false,   // Step 7: prevents resume looping on ticket status after a ticket exists
    pending: null            // {type, data} for exact resume of the last unanswered step
  };

  function persistState(){
    _saveLS({
      session_id: STATE.session_id,
      college: STATE.college,
      status: STATE.status,
      topic: STATE.topic,
      checkpoint: STATE.checkpoint,
      ticket_id: STATE.ticket_id,
      ticket_prompted: STATE.ticket_prompted,
      pending: STATE.pending,
      saved_at: Date.now()
    });
  }

  function loadStateIntoMemory(saved){
    if(!saved) return;
    if(saved.session_id){ sessionId = saved.session_id; STATE.session_id = saved.session_id; }
    STATE.college = saved.college || null;
    STATE.status  = saved.status || null;
    STATE.topic   = saved.topic || null;
    STATE.checkpoint = saved.checkpoint || STATE.checkpoint || 'start';
    STATE.ticket_id = saved.ticket_id || null;
    STATE.ticket_prompted = !!saved.ticket_prompted;
    STATE.pending = saved.pending || null;
  }

  
  // ----- Step 7: exact resume helpers (add-only) -----
  function setPending(type, data){
    STATE.pending = { type: type, data: (data||{}) };
    persistState();
  }
  function clearPending(){
    STATE.pending = null;
    persistState();
  }

  // Render buttons and remember what the user still needs to answer (for exact resume)
  function renderButtonsPending(pendingType, labels, handler, data){
    setPending(pendingType, data||{});
    return renderButtons(labels, async (choice)=>{
      // once user clicks, this pending question is answered
      clearPending();
      return handler(choice);
    });
  }

  async function resumePending(){
    const p = STATE.pending;
    if(!p || !p.type) return false;

    // Ensure progress card shows the restored context
    updateProgressCard();

    // Resume by re-showing ONLY the last unanswered question (no replay)
    const t = p.type;
    const d = p.data || {};
    if(t === 'choose_college'){
      appendBot(`<p class="p"><strong>Main Menu</strong> — choose your college.</p>`);
      const colleges = (START_CACHE && Array.isArray(START_CACHE.colleges))
        ? START_CACHE.colleges
        : [
            "College of Professional Studies",
            "College of Engineering",
            "College of Science"
          ];
      renderButtonsPending('choose_college', colleges, onPickCollege, {});
      return true;
    }

    if(t === 'choose_status'){
      // College already selected; ask the same student-type question again
      appendBot(`<p class="p">Great — ${STATE.college}. Are you a new or continuing student?</p>`);
      renderButtonsPending('choose_status', ["Incoming Student","Continuing Student"], onPickStatus, {});
      return true;
    }

    if(t === 'choose_topic'){
      appendBot(`<p class="p">Got it — ${STATE.status}. Choose a topic:</p>`);
      const isNew = (STATE.status === "New Student" || STATE.status === "Incoming Student");
      if(isNew){
        renderButtonsPending('choose_topic', [
          "Northeastern Credentials",
          "Course Registration",
          "Program Information",
          "Registration Error (New Students)",
          "Deferral and Late Arrivals (New Students)",
          "Back to the Start"
        ], onPickIncomingTopicOrBack, {});
      } else {
        renderButtonsPending('choose_topic', [
          "Northeastern Credentials",
          "Course Registration",
          "Program Information",
          "Transcripts",
          "Graduation",
          "Leave of Absence",
          "Appeals & Grade Dispute",
          "Back to the Start"
        ], onPickTopicOrBack, {});
      }
      return true;
    }

    if(t === 'ask_anything_else'){
      // resume the "anything else?" question
      const topic = d.topic || STATE.topic;
      appendBot(`<p class="p"><strong>Is there anything else you would like help with today?</strong></p>`);
      renderButtonsPending('ask_anything_else', ["Yes","No","Main Menu"], (pick)=>{
        if(pick === "Yes" || pick === "Main Menu") return showMainMenuInline();
        // go to helpful question
        showHelpfulQuestion(topic);
      }, {topic});
      return true;
    }

    if(t === 'helpful_question'){
      const topic = d.topic || STATE.topic;
      showHelpfulQuestion(topic);
      return true;
    }

    if(t === 'negative_feedback'){
      const topic = d.topic || STATE.topic;
      showNegativeFeedbackForm(topic);
      return true;
    }

    return false;
  }

  // Extracted (add-only) helpers so resume can land exactly on these steps
  function showHelpfulQuestion(topic){
    appendBot(`<p class="p"><strong>Was this information helpful?</strong></p>`);
    renderButtonsPending('helpful_question', [
      "Yes, it was helpful",
      "No, I still need help",
      "Main Menu"
    ], (fb)=>{
      if(fb === "Main Menu") return showMainMenuInline();
      if(fb && fb.startsWith("Yes")){
        sendFeedback({ helpful:true, topic });
        appendBot(`<p class="p">That’s Great! I’m glad we were able to provide the information you needed.</p>`);
        appendBot(`<p class="p"><strong>Is there anything else I can help you with today?</strong></p>`);
        return renderButtonsPending('ask_anything_else', ["Yes","No","Main Menu"], end=>{
          if(end === "Yes" || end === "Main Menu") return showMainMenuInline();
          appendBot(`<p class="p">I’m glad I was able to help you today and I look forward to having you back. Till next time!</p>`);
          renderButtonsPending('choose_college', ["Main Menu"], ()=>showMainMenuInline(), {});
        }, {topic});
      }
      // Negative path → show exact feedback form
      return showNegativeFeedbackForm(topic);
    }, {topic});
  }

  function showNegativeFeedbackForm(topic){
    // Mark that this is the pending step
    setPending('negative_feedback', {topic});

    const id = 'neg_' + Math.random().toString(36).slice(2);
    appendBot(`
      <div class="p" id="${id}">
        I’m sorry I couldn’t help you find what you were looking for today. Please let me know what you feel needs improving.
        <div style="margin-top:6px">
          <label><input type="checkbox" value="incorrect"> Information is Incorrect</label><br/>
          <label><input type="checkbox" value="not_relevant"> Information is Not Relevant</label><br/>
          <label><input type="checkbox" value="unclear"> Information is Unclear</label><br/>
          <label><input type="checkbox" value="need_more_details"> I Need More Details</label>
        </div>

        <p class="p" style="margin-top:6px;color:#C8102E;font-weight:700">
          Please don't add your personal information (e.g., NUID, emails, and phone numbers).
        </p>

        <div style="margin-top:6px">
          <input type="text"
                 placeholder="Optional: add a short note"
                 style="width:100%;padding:8px;border:1px solid #bbb;border-radius:8px"/>
        </div>
        <div class="row" style="margin-top:8px">
          <div class="btn" id="${id}_submit">Submit feedback</div>
        </div>
      </div>
    `);

    setTimeout(()=>{
      const wrap = document.getElementById(id);
      const btn  = document.getElementById(id + '_submit');
      if(!wrap || !btn) return;

      // Use existing reason capture helper
      btn.onclick = async ()=>{
        const reasons = [];
        wrap.querySelectorAll('input[type="checkbox"]:checked').forEach(cb=>{
          const v = (cb.value||'').trim();
          if(v) reasons.push(v);
        });
        const noteInput = wrap.querySelector('input[type="text"]');
        const note = noteInput ? (noteInput.value||'') : '';

        clearPending();
        // send feedback (non-blocking) then check if escalation is ready
        sendFeedback({ helpful:false, topic, reasons, note });

        // Small wait/retry to allow server to process beacon/fetch before we peek escalation.
        async function _waitForEscalation(maxTries=6, delayMs=250){
          for(let i=0;i<maxTries;i++){
            try{
              const e = await peekEscalation();
              if(e && e.escalation_ready){
                return e;
              }
            }catch(_){}
            await new Promise(r=>setTimeout(r, delayMs));
          }
          return null;
        }

        appendBot(`<p class="p">Thanks — your feedback has been recorded.</p>`);

// Step 6/7 behavior: after any negative feedback, always offer the Advisor Ticket option.
// If escalation rules are ready, we show the richer advisor handoff summary.
// If not, we still show the handoff card using the current context (topic/college/status + reasons + note).
let esc = null;
try{ esc = await _waitForEscalation(); }catch(_){}

if(esc && esc.escalation_ready){
  showAdvisorHandoffCard(esc.summary || {}, esc.escalation_reason || "");
  return;
}

// Fallback summary (no escalation trigger, but ticketing must still be available)
showAdvisorHandoffCard({
  college: STATE.college || "",
  student_type: STATE.status || "",
  topic: topic || STATE.topic || "",
  reasons: reasons || [],
  note: note || "",
  steps_tried: (STATE && Array.isArray(STATE.steps_done)) ? STATE.steps_done : []
}, "");
return;};
    }, 0);
  }
  // ----- /Step 7 helpers -----
async function hardStartOver(){
    // Clear local state first (UI-safe)
    _clearLS();
    try{
      await post('/api/v2/start_over', { session_id: STATE.session_id });
    }catch(e){}
    sessionId = _newSessionId();
    STATE.session_id = sessionId;
    STATE.college = null; STATE.status = null; STATE.topic = null;
    STATE.ticket_id = null;
    STATE.ticket_prompted = false;
    STATE.pending = null;
    STATE.checkpoint = 'start';
    persistState();
    return await freshStart();
  }


  /* ----- Step 2: Visible Progress Tracker (additive; no flow changes) ----- */
  function updateProgressCard(){
    // Create once, then update in-place (no new bubbles added).
    let card = document.getElementById('progress-card');
    if(!card){
      card = document.createElement('div');
      card.id = 'progress-card';
      card.className = 'row card';
      // Keep styling consistent with existing cards (no new CSS rules).
      card.style.marginTop = 'calc(0.6 * var(--cm))';
      // Insert at the very top of the chat stack so it's always visible.
      stack.insertBefore(card, stack.firstChild);
    }

    const ok = (v)=> (v ? "✅" : "⬜");
    const college = STATE.college ? STATE.college : "Not selected";
    const studentType = STATE.status ? STATE.status : "Not selected";
    const topic = STATE.topic ? STATE.topic : "Not selected";

    card.innerHTML = `
      <div class="p">
        <strong>Progress</strong><br>
        ${ok(STATE.college)} College: <strong>${college}</strong><br>
        ${ok(STATE.status)} Student type: <strong>${studentType}</strong><br>
        ${ok(STATE.topic)} Current task: <strong>${topic}</strong>
      </div>
    `;
  }


  let START_CACHE = null;

  (async function init(){
    // Step 7: Resume exactly on refresh (demo-safe; no UI/layout changes)
    if(_LS0 && _LS0.session_id && (_LS0.college || _LS0.status || _LS0.topic || _LS0.ticket_id)){
      loadStateIntoMemory(_LS0);
      updateProgressCard();

      appendBot(`<p class="p"><strong>Continue where you left off?</strong></p>`);
      return renderButtons(["Continue","Start Over"], async pick=>{
        if(pick === "Start Over"){

  async function freshStart(){
    const data = await post('/api/v2/start', { session_id: STATE.session_id });
    START_CACHE = data;

    try{
      if(!data || (!data.title && !Array.isArray(data.colleges))){
        appendBot(`<p class="p" style="color:#C8102E"><strong>⚠️ Bot couldn’t load.</strong><br>
          Please confirm the server is running and the endpoint <code>/api/v2/start</code> is reachable.</p>`);
      }
    }catch(e){}

    if (data && data.title) appendBot(`<h3 class="title">${data.title}</h3>`);

    if (data && data.intro){
      String(data.intro).split('<br>').map(s=>s.trim()).filter(Boolean).forEach(part=>{
        appendBot(`<p class="p">${part}</p>`);
      });
    }

    if (data && Array.isArray(data.colleges)){
      renderButtonsPending('choose_college', data.colleges, onPickCollege, {});
    }

    STATE.checkpoint = 'start';
    persistState();
    updateProgressCard();
  }

  async function resumeFromSaved(){
    // Step 7: if we have an exact pending step, resume it first.
    try{ if(await resumePending()){ return; } }catch(e){}

    // If a ticket exists, DO NOT force-resume into ticket status (prevents looping after refresh).
    // Instead, offer an optional "View Ticket Status" and then show the normal Main Menu.
    if(STATE.ticket_id && !STATE.ticket_prompted){
      try{
        const st = await fetchTicketStatus(STATE.ticket_id);
        if(st && st.ok && st.ticket && st.ticket.exists){
          st.ticket._admin = (st.admin || {});
          const tid = escapeHtml(st.ticket.ticket_id || STATE.ticket_id);
          const status = escapeHtml(st.ticket.status || 'In Progress');

          // Mark as prompted so refresh won't keep landing here
          STATE.ticket_prompted = true;
          persistState();

          appendBot(`<p class="p"><strong>We found an existing ticket</strong><br>
            Ticket <strong>${tid}</strong> is currently: <strong>${status}</strong>.<br>
            Would you like to view the detailed status now?</p>`);

          // If user chooses to view, show the status card (but we still won't lock resume to it).
          return renderButtons(["View Ticket Status","Main Menu"], pick=>{
            if(pick === "View Ticket Status"){
              // Do not set checkpoint to ticket_tracking; keep resume free.
              showTicketStatusCard(st.ticket);
              updateProgressCard();
              return renderButtons(["Main Menu"], ()=>showMainMenuInline());
            }
            return showMainMenuInline();
          });
        }
      }catch(e){}
      // If ticket can't be fetched, fall through to rebuild the flow menu.
    }

    // Rebuild to the exact pending step (deterministic, no replay).
    if(STATE.college && !STATE.status){
      updateProgressCard();
      // This will render the correct prompt + buttons
      return await onPickCollege(STATE.college);
    }

    if(STATE.college && STATE.status && !STATE.topic){
      updateProgressCard();
      // Ensure college context is applied, then show the same topic menu
      await onPickCollege(STATE.college);
      return await onPickStatus(STATE.status);
    }

    if(STATE.college && STATE.status && STATE.topic){
      updateProgressCard();
      const isNew = (STATE.status === "New Student" || STATE.status === "Incoming Student");
      if(isNew){
        return onPickIncomingTopicOrBack(STATE.topic);
      }
      return onPickTopicOrBack(STATE.topic);
    }

    // Default fallback
    return await freshStart();
  }

        appendBot(`<p class="p">You can log in to Canvas using your Northeastern credentials here: ${linkBtn("Canvas","https://canvas.northeastern.edu/")}</p>`);
        appendBot(`<p class="p">Were you able to log in?</p>`);

        renderButtons(["Yes","No","Main Menu"], l=>{
          if(l==="Main Menu") return showMainMenuInline();

          if(l==="Yes") return firstDay();

          appendBot(`<p class="p">If you still cannot log in, please contact the IT Service Desk at <a class="link" href="mailto:help@northeastern.edu">help@northeastern.edu</a> for assistance.</p>`);
          helpfulTail("Program Information");
        });
      });

      function firstDay(){
        appendBot(`<p class="p">Is today your first day of the term?</p>`);

        renderButtons(["Yes","No","Main Menu"], d=>{
          if(d==="Main Menu") return showMainMenuInline();

          if(d==="No"){
            appendBot(`<p class="p">Courses you have registered for go live on Canvas two days before the course start date. Please check back 24 hours before the first day of your term.</p>`);
            return helpfulTail("Program Information");
          }

          appendBot(`<p class="p">Are your courses now available on Canvas?</p>`);

          renderButtons(["Yes","No","Main Menu"], now=>{
            if(now==="Main Menu") return showMainMenuInline();

            if(now==="Yes"){
              appendBot(`<p class="p">You’re all set! Have a great term.</p>`);
              return helpfulTail("Program Information");
            }

            appendBot(`<p class="p">You will need to get in touch with your course instructor. Please send them an email or speak with them after your first lecture.</p>`);
            helpfulTail("Program Information");
          });
        });
      }
    });
  }

  /* ----- Flow 4: Registration Error (Incoming Students) ----- */
  function flowRegistrationError(){
    appendBot(`<p class="p"><strong>Registration Error – Incoming Students</strong><br>Have you registered for your courses?</p>`);

    renderButtons(["Yes","No","Main Menu"], ans=>{
      if(ans==="Main Menu") return showMainMenuInline();

      if(ans==="Yes"){
        appendBot(`<p class="p">Are you looking to change one or more of the courses you are currently registered in?</p>`);

        return renderButtons(["Yes","No","Main Menu"], a2=>{
          if(a2==="Main Menu") return showMainMenuInline();

          if(a2==="Yes"){
            appendBot(`<p class="p">You can log in to your Student Hub here: ${linkBtn("me.northeastern.edu","https://me.northeastern.edu/")} and change your courses from the Course Registration section.</p>`);
            return helpfulTail("Registration Error (New Students)");
          }

          return registrationHelp();
        });
      }

      registrationHelp();
    });

    function registrationHelp(){
      appendBot(`<p class="p">Do you need assistance with course registration or an error message you’re seeing?</p>`);

      renderButtons(["Yes","No","Main Menu"], need=>{
        if(need==="Main Menu") return showMainMenuInline();

        if(need==="No"){
          appendBot(`<p class="p">If your plans change, you can always review key dates in the Academic Calendar here: ${linkBtn("Academic Calendar","https://registrar.northeastern.edu/group/calendar/")}</p>`);
          return helpfulTail("Registration Error (New Students)");
        }

        appendBot(`<p class="p">Some registration issues are related to <strong>I Am Here</strong>, Northeastern’s required attendance verification step for students.</p>`);
        appendBot(`<p class="p">Have you completed the I Am Here process for this term?</p>`);

        renderButtons(["Yes","No","I'm not sure","Main Menu"], ih=>{
          if(ih==="Main Menu") return showMainMenuInline();

          if(ih==="No"){
            appendBot(`<p class="p">Log in to your Student Hub: ${linkBtn("me.northeastern.edu","https://me.northeastern.edu/")} and look for the <strong>I Am Here</strong> prompt to confirm your attendance.</p>`);
            appendBot(`<p class="p">If the deadline has passed or you still see errors after completing I Am Here, please contact your student support team.</p>`);
          } else {
            appendBot(`<p class="p">If you are unsure about your I Am Here status or you may have missed the deadline, please connect with your support team as soon as possible.</p>`);
          }

          appendBot(`<p class="p"><strong>For CPS students</strong>, contact Learner Services:<br>
            Phone: <strong>1-833-NU-LEARN (1-833-685-3276)</strong><br>
            Email: <a class="link" href="mailto:learnerservices@northeastern.edu">learnerservices@northeastern.edu</a></p>`);
          appendBot(`<p class="p"><strong>For students in other colleges</strong>, please contact your academic advisor or the Toronto student support services: ${linkBtn("Student Support – Toronto","https://studentlifetoronto.sites.northeastern.edu/student-support-services/")}</p>`);
          appendBot(`<p class="p">You can also review important dates (like add/drop and I Am Here deadlines) in the Academic Calendar: ${linkBtn("Academic Calendar","https://registrar.northeastern.edu/group/calendar/")}</p>`);
          return showTroubleshooter(
          "Registration Error (New Students)",
          "Quick troubleshooter: what type of registration issue are you seeing?",
          [
            { label: "Hold / Block on account", html: `<p class="p">If you have a hold, Student Hub will usually show the reason under your account/registration area.<br>
              Review holds and next steps, then retry registration.<br>
              If you need support, contact your student support team listed above.</p>` },
            { label: "Prerequisite / program restriction", html: `<p class="p">If you see a prerequisite or program restriction message, it typically means a requirement is missing or you need approval/override.<br>
              Please contact your support team listed above with the exact course code and the message you see.</p>` },
            { label: "Course full / time conflict", html: `<p class="p">If the course is full or there is a schedule conflict, try selecting an alternate section if available in Student Hub.<br>
              If you’re unsure which section to pick, contact your support team listed above.</p>` },
            { label: "Not sure / different error", html: `<p class="p">Please take a screenshot of the exact error message and share it with your support team listed above so they can resolve it quickly.</p>` }
          ]
        );
        });
      });
    }
  }

  /* ----- Flow 5: Deferral and Late Arrivals (Incoming Students) ----- */
  function flowDeferralLateArrivals(){
    appendBot(`<p class="p"><strong>Deferral and Late Arrivals – Incoming Students</strong><br>Do you know where you can find key dates and important deadlines for the academic year?</p>`);

    renderButtons(["Yes","No","Main Menu"], ans=>{
      if(ans==="Main Menu") return showMainMenuInline();

      if(ans==="No"){
        appendBot(`<p class="p">You can find term start dates, add/drop deadlines, and other important dates in the Academic Calendar: ${linkBtn("Academic Calendar","https://registrar.northeastern.edu/group/calendar/")}</p>`);
      }

      appendBot(`<p class="p">Are you looking for more information about <strong>Late Arrival dates</strong> or <strong>deferral policies</strong> for your program?</p>`);

      renderButtons(["Yes","No","Main Menu"], more=>{
        if(more==="Main Menu") return showMainMenuInline();

        if(more==="No"){
          appendBot(`<p class="p">If your plans change or you have questions about timing, your admissions or academic advisor can help you interpret the dates in the Academic Calendar.</p>`);
          return helpfulTail("Deferral and Late Arrivals (New Students)");
        }

        appendBot(`<p class="p">Generally, students should not arrive in Canada after the published <strong>Late Arrival Date</strong> or Program Start Date for their term. If your study permit or travel plans do not allow you to arrive by this date, you may need to request a deferral.</p>`);
        appendBot(`<p class="p">For the latest details about late arrival and deferral for the Canadian campuses, please review:</p>`);
        appendBot(`<p class="p">• ${linkBtn("OGS Canada – Late Arrival and Deferral Policies","https://international.northeastern.edu/ogs/student-support/global-campuses/canada/late-arrival-and-deferral-policies/")}<br>
          • ${linkBtn("Graduate Admissions – Deferral FAQ","https://northeastern.my.site.com/GraduateAdmissionsFAQ/s/article/If-I-am-accepted-can-I-defer-my-admission.")}</p>`);
        appendBot(`<p class="p">If you still have questions after reviewing these pages, please contact your admissions counselor or academic advisor for guidance specific to your program and campus.</p>`);
        helpfulTail("Deferral and Late Arrivals (New Students)");
      });
    });
  }

  /* ===== Server-driven (unchanged) for other branches ===== */
  async function onPickTopicOrBack(lbl){
    if (lbl === "Back to the Start") return startOver();
    STATE.topic = lbl;

    const data = await post('/api/v2/topic', {
      session_id: STATE.session_id,
      college: STATE.college,
      status: STATE.status,
      topic: STATE.topic
    });

    
    window.LAST_TOPIC = topic;
if (data.question)
      appendBot(`<p class="p">${data.question}</p>`);

    if (data.yesLabel && data.noLabel)
      renderButtons([data.yesLabel, data.noLabel], ans => onAnswer(ans));
  }

  async function onAnswer(ans){
    const data = await post('/api/v2/answer', {
      session_id: STATE.session_id,
      college: STATE.college,
      status: STATE.status,
      topic: STATE.topic,
      answer: ans
    });

    if (data.reply)
      appendBot(`<p class="p link">${data.reply}</p>`);

    if (data.askMore === true){
      appendBot(`<p class="p"><strong>Is there anything else you would like help with today?</strong></p>`);

      return renderButtons(["Yes","No","Main Menu"], pick=>{
        if (pick === "Yes" || pick === "Main Menu")
          return showMainMenuInline();

        renderButtons(
          [data.feedbackYes, data.feedbackNo, data.startOver],
          onFeedbackOrStart
        );
      });
    }

    renderButtons(
      [data.feedbackYes, data.feedbackNo, data.startOver],
      onFeedbackOrStart
    );
  }

  async function onFeedbackOrStart(lbl){
    if (lbl === "Back to the Start") return startOver();

    const t = (lbl || '').toLowerCase();
    const isPositive = t.includes('helpful') && !(/\bnot\b|n['’]t/).test(t);

    await post('/api/v2/feedback', {
      session_id: STATE.session_id,
      college: STATE.college,
      status: STATE.status,
      topic: STATE.topic,
      helpful: isPositive
    });

    appendBot(`<p class="p">Thanks for the feedback! You can continue below.</p>`);
    renderButtons(["Main Menu"], () => showMainMenuInline());
  }

  async function startOver(){
    const data = await post('/api/v2/start_over', {
      session_id: STATE.session_id
    });

    STATE = {
      session_id: STATE.session_id,
      college: null,
      status: null,
      topic: null
    };
    updateProgressCard();

    if (data.title)
      appendBot(`<h3 class="title">${data.title}</h3>`);

    if (data.intro){
      String(data.intro)
        .split('<br>')
        .map(s=>s.trim())
        .filter(Boolean)
        .forEach(part=>{
          appendBot(`<p class="p">${part}</p>`);
        });
    }

    if (Array.isArray(data.colleges)){
      START_CACHE = data;
      renderButtons(data.colleges, onPickCollege);
    }
  }

  window.addEventListener('beforeunload', ()=>{
    navigator.sendBeacon(
      '/api/v2/feedback',
      new Blob([
        JSON.stringify({
          session_id: STATE.session_id,
          choice: 'end'
        })
      ], {type:'application/json'})
    );
  });


</script>
